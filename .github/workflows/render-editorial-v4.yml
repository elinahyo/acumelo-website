name: Render editorial review v4

on:
  workflow_dispatch:
  push:
    branches: [codex/media-v4-ci]
    paths: [media-production/v4-20261124/render-request.json]

permissions:
  contents: read
  actions: read

concurrency:
  group: acumelo-editorial-v4
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: chris
            only: chris-workflow-demo,chris-strategy-demo,chris-design-demo,chris-analytics-demo,chris-marketing-demo,chris-development-demo
          - part: sage
            only: sage-strategy-demo,sage-design-demo,sage-development-demo
          - part: pillow
            only: pillow-design-demo,pillow-development-demo
          - part: projects
            only: workflow-showcase,strategy-showcase,design-showcase,analytics-showcase,marketing-showcase,development-showcase
    env:
      FFMPEG_PATH: ffmpeg
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read recovery request
        id: request
        env:
          PART: ${{ matrix.part }}
        run: |
          node -e 'const fs=require("fs"),r=JSON.parse(fs.readFileSync("media-production/v4-20261124/render-request.json"));const reuse=Number.isSafeInteger(r.reuseRun)&&r.reuseRun>0&&r.reuseParts?.includes(process.env.PART);fs.appendFileSync(process.env.GITHUB_OUTPUT,"reuse="+Boolean(reuse)+"\nrun="+(reuse?r.reuseRun:0)+"\n")'
      - name: Reuse already verified films
        if: steps.request.outputs.reuse == 'true'
        uses: actions/download-artifact@v4
        with:
          name: editorial-${{ matrix.part }}-${{ steps.request.outputs.run }}
          run-id: ${{ steps.request.outputs.run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: editorial-output
      - name: Install public dependencies
        if: steps.request.outputs.reuse != 'true'
        timeout-minutes: 6
        run: |
          sudo python3 - <<'PY'
          import pathlib, re
          for name in ['/etc/apt/apt-mirrors.txt', '/etc/apt/sources.list', '/etc/apt/sources.list.d/ubuntu.sources']:
              p = pathlib.Path(name)
              if p.exists():
                  old = p.read_text()
                  new = re.sub(r'https?://[a-z0-9.-]+\.ec2\.archive\.ubuntu\.com/ubuntu', 'http://archive.ubuntu.com/ubuntu', old)
                  if new != old:
                      p.write_text(new)
                      print('Selected official Ubuntu archive for', p.name)
          PY
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends ffmpeg fonts-dejavu-core
          npm install --global pnpm@9.15.9 --fetch-timeout=30000 --fetch-retries=2
          pnpm --dir media-production/v3-20261123 install --frozen-lockfile --ignore-scripts
          python -m pip install --timeout 30 --retries 2 -r media-production/v4-20261124/requirements-ci.txt
      - name: Verify requested source hashes
        run: |
          node -e 'const fs=require("fs"),c=require("crypto"),r=JSON.parse(fs.readFileSync("media-production/v4-20261124/render-request.json"));for(const [p,expected] of Object.entries(r.sourceSha256)){if(c.createHash("sha256").update(fs.readFileSync(p)).digest("hex")!==expected)throw Error("Source hash mismatch: "+p)}'
      - name: Build music without voices
        if: steps.request.outputs.reuse != 'true'
        run: python media-production/v4-20261124/build-music.py --source media-production/v3-20261123 --output editorial-output
      - name: Render public-source review films
        if: steps.request.outputs.reuse != 'true'
        env:
          ONLY: ${{ matrix.only }}
        run: node media-production/v4-20261124/render-editorial.mjs --source media-production/v3-20261123 --media assets/media/20261123c --output editorial-output --only "$ONLY"
      - name: Validate films and audio identity
        if: steps.request.outputs.reuse != 'true'
        env:
          ONLY: ${{ matrix.only }}
        run: node media-production/v4-20261124/validate-editorial.mjs --output editorial-output --only "$ONLY"
      - name: Upload public review material only
        uses: actions/upload-artifact@v4
        with:
          name: editorial-${{ matrix.part }}-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: |
            editorial-output/*.mp4
            editorial-output/posters/*.jpg
            editorial-output/captions/*.vtt
            editorial-output/proofs/*.jpg
            editorial-output/metadata/*.json

  stage-review:
    needs: render
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: editorial-*-${{ github.run_id }}
          path: editorial-output
          merge-multiple: true
      - name: Verify complete review collection
        run: |
          node media-production/v4-20261124/validate-editorial.mjs --output editorial-output --manifest-only
          node media-production/v4-20261124/stage-editorial.mjs
      - name: Commit review branch without changing the website
        run: |
          git switch -c "codex/media-v4-render-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/media/20261124d
          git commit -m "Stage v4 editorial review films after technical and audio validation"
          git push origin "HEAD:refs/heads/codex/media-v4-render-${GITHUB_RUN_ID}"
          echo "Review branch: codex/media-v4-render-${GITHUB_RUN_ID}" >> "$GITHUB_STEP_SUMMARY"
          echo "No main update, no automatic website remapping, editorial approval still required." >> "$GITHUB_STEP_SUMMARY"
